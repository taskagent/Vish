
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random WhatsApp Number</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg,#09090f,#251044);
  font-family: Arial, sans-serif;
  color: white;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 400px;
  background: #171525;
  padding: 30px 22px;
  border-radius: 20px;
  text-align: center;
  border: 1px solid #60418a;
  box-shadow: 0 10px 40px #0008;
}

h2 {
  color: #d8a7ff;
  margin-bottom: 10px;
}

p {
  color: #bbb;
  font-size: 14px;
}

.number {
  margin: 25px 0;
  padding: 18px 8px;
  background: #0c0b14;
  border-radius: 12px;
  font-size: 22px;
  font-weight: bold;
  color: #35e68a;
  min-height: 60px;
  overflow-wrap: anywhere;
}

button {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 10px;
  background: #20c968;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(.97);
}

.footer {
  margin-top: 20px;
  font-size: 12px;
  color: #888;
}
</style>
</head>

<body>

<div class="container">

<h2>🎯 Random WhatsApp</h2>

<p>Click below to get a random number</p>

<div class="number" id="number">
  Your Number Here
</div>

<button onclick="getRandomNumber()">

<div class="footer">
